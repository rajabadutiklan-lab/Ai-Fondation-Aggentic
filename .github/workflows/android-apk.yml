name: Build Android APK
on:
  push:
    branches: [main]
    paths: ['lib/**', 'test/**', 'pubspec.yaml', '.github/workflows/android-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true
      - name: Generate Android platform
        run: |
          cp lib/main.dart /tmp/ewasho-main.dart
          flutter create --project-name ewasho --org id.ewasho --platforms android .
          cp /tmp/ewasho-main.dart lib/main.dart
          rm -f test/widget_test.dart
          sed -i 's/android:label="ewasho"/android:label="EWASHO"/' android/app/src/main/AndroidManifest.xml
          flutter pub get
      - name: Analyze application
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Test home and report screens
        run: flutter test
      - name: Build installable preview
        run: |
          flutter build apk --release --build-number "$GITHUB_RUN_NUMBER"
          cp build/app/outputs/flutter-apk/app-release.apk EWASHO-preview.apk
          sha256sum EWASHO-preview.apk > EWASHO-preview.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: EWASHO-Android-APK
          path: |
            EWASHO-preview.apk
            EWASHO-preview.apk.sha256
            screenshots/
      - name: Publish APK download
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: build-${{ github.run_number }}
        run: |
          gh release create "$RELEASE_TAG" EWASHO-preview.apk EWASHO-preview.apk.sha256 --target "$GITHUB_SHA" --title "EWASHO Android Preview ${{ github.run_number }}" --notes "Prototipe EWASHO: beranda dan halaman Laporan. Data contoh. Efek kaca hanya di slider beranda. Build release, debug signing untuk uji instalasi." --prerelease
          # Create the stable download release in this destination repository.
          gh release view preview-3 >/dev/null 2>&1 || gh release create preview-3 --target "$GITHUB_SHA" --title "EWASHO Preview Terbaru" --notes "APK terbaru EWASHO." --prerelease
          gh release upload preview-3 EWASHO-preview.apk EWASHO-preview.apk.sha256 --clobber
          gh release edit preview-3 --title "EWASHO Preview Terbaru" --notes "APK terbaru dari build ${{ github.run_number }}, commit $GITHUB_SHA. Beranda dan Laporan dengan data contoh. Tag ini tetap sebagai tautan unduh; sumber setiap build tersedia pada release build-${{ github.run_number }}."
