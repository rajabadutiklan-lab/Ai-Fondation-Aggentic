name: Agentic CI

on:
  push:
    branches:
      - main
      - 'build/**'
  pull_request:
    branches:
      - main

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pytest -q

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android host project
        working-directory: mobile
        run: |
          flutter create --platforms=android --project-name ai_foundation_agentic .
          rm -rf test
      - name: Install Flutter dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Analyze Dart source
        working-directory: mobile
        run: flutter analyze lib --no-fatal-infos
      - name: Build debug APK
        working-directory: mobile
        run: flutter build apk --debug --dart-define=API_BASE_URL=http://10.0.2.2:8000
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-foundation-agentic-v3-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
